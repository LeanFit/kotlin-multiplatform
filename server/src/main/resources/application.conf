ktor {
    deployment {
        port = 8080
        port = ${?PORT}
    }
    application {
        modules = [ com.gongbaek.garangbi.GarangbiApplicationKt.module ]
    }
}

database {
    url = ${DB_URL}
    user = ${DB_USER}
    password = ${DB_PASSWORD}
    poolSize = 10
    poolSize = ${?DB_POOL_SIZE}
}

jwt {
    secret = ${JWT_SECRET}
    issuer = "garangbi"
    audience = "garangbi-users"
    realm = "garangbi"
}
